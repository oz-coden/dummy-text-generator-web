<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="文字列を指定した文字数・回数に合わせて生成します。">
    <title>ダミーテキストジェネレーター | oz-coden tools</title>
    <script src="vendor/ui/ui.js"></script>
    <link rel="stylesheet" href="vendor/ui/ui.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="ui-header" data-ui-header data-title="ダミーテキストジェネレーター" data-source="https://github.com/oz-coden/dummy-text-generator-web">
        <a class="ui-brand" href="https://tools.oz-coden.com/">oz-coden tools</a>
    </header>
    <main class="ui-main">
        <div class="ui-heading">
            <p class="ui-eyebrow">TEXT TOOLS</p>
            <h1>ダミーテキストジェネレーター</h1>
            <p class="ui-description">文字列を指定した文字数・回数に合わせて生成します。</p>
        </div>
        <form id="generator-form" class="ui-panel ui-stack" aria-label="テキスト生成" novalidate>
            <div class="ui-row">
                <div><label for="textSource">使用する文字列</label><select id="textSource">
                    <option value="ihatov">ポラーノの広場（宮沢賢治）</option>
                    <option value="merosu">走れメロス（太宰治）</option>
                    <option value="wagahai">吾輩は猫である（夏目漱石）</option>
                    <option value="lorem">Lorem ipsum</option>
                    <option value="custom">カスタム文字列</option>
                </select></div>
                <div id="customInputWrapper" class="hidden"><label for="customString">カスタム文字列</label><input type="text" id="customString" placeholder="繰り返す文字列を入力"></div>
            </div>
            <div class="ui-row">
                <div><label for="generateMode">出力の条件</label><select id="generateMode">
                    <option value="length">指定した文字数まで出力</option><option value="repeat">指定した回数繰り返す</option>
                </select></div>
                <div><label for="countValue" id="countLabel">文字数</label><input type="number" id="countValue" value="400" min="1" max="1000000" step="1"></div>
            </div>
            <div class="ui-actions"><button type="submit" class="btn-primary">テキストを生成する</button></div>
            <p id="tool-status" class="ui-status" role="status"></p>
        </form>
        <section class="ui-panel">
            <div class="ui-between"><label for="outputText">生成結果</label><button class="btn-copy" onclick="copyToClipboard()" id="copyBtn">クリップボードにコピー</button></div>
            <textarea id="outputText" readonly placeholder="生成したテキストが表示されます"></textarea>
            <p class="ui-note">日本語プリセットは作品の冒頭です。最大100万文字。文字数はUnicodeコードポイントで数えます。</p>
        </section>
    </main>
</body>
</html>
